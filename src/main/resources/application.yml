server:
  port: 8080

spring:
  application:
    name: llm-shadow-router
  threads:
    virtual:
      enabled: true

inference:
  base-url: ${DO_INFERENCE_BASE_URL:https://inference.do-ai.run/v1}
  access-key: ${DO_MODEL_ACCESS_KEY:}
  primary-model: ${PRIMARY_MODEL:llama3.3-70b-instruct}
  candidate-model: ${CANDIDATE_MODEL:openai-gpt-oss-120b}
  primary-timeout: ${PRIMARY_TIMEOUT:60s}
  candidate-timeout: ${CANDIDATE_TIMEOUT:90s}
  # Bounded shadow pool: reject (shed) when concurrency + queue are full.
  shadow-max-concurrency: ${SHADOW_MAX_CONCURRENCY:32}
  shadow-queue-capacity: ${SHADOW_QUEUE_CAPACITY:128}

shadow:
  # Initial mirror rate; change at runtime via PUT /config.
  routing-percentage: ${SHADOW_ROUTING_PERCENTAGE:100}
  sqlite-path: ${SHADOW_SQLITE_PATH:./data/shadow-mismatches.db}

logging:
  level:
    com.example.shadowrouter: INFO
